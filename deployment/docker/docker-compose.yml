

services:
  rag-api:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    container_name: rag-document-qa
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    environment:
      
      - DEBUG=False
      - LOG_LEVEL=INFO
      - CHROMA_PERSIST_DIRECTORY=/app/chroma_data
    volumes:
      - chroma-data:/app/chroma_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  chroma-data:
    driver: local
